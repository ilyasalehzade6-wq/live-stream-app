<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PCB Cinema - Live Watch & Chat</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Segoe UI', Tahoma, sans-serif; height: 100dvh; overflow: hidden; }
        
        .view { display: none; height: 100%; }
        .view.active { display: flex; flex-direction: column; }
        
        #login-view { justify-content: center; align-items: center; }
        .card { background: #18181b; padding: 40px; border-radius: 16px; border: 1px solid #27272a; text-align: center; width: 400px; max-width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h1 { font-size: 28px; margin-bottom: 8px; color: #3b82f6; }
        .card p { color: #a1a1aa; margin-bottom: 25px; font-size: 15px; }
        
        input[type="text"] { width: 100%; padding: 14px; margin-bottom: 15px; background: #09090b; border: 1px solid #27272a; border-radius: 8px; color: #fff; outline: none; font-family: inherit; font-size: 16px; transition: 0.2s; }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        button { padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 15px; transition: 0.2s; }
        .primary { background: #3b82f6; color: white; }
        .primary:hover { background: #2563eb; }
        .primary:disabled { background: #27272a; color: #a1a1aa; cursor: not-allowed; }
        .secondary { background: #10b981; color: white; }
        .secondary:hover { background: #059669; }
        .danger { background: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .danger:hover { background: #dc2626; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #18181b; border-bottom: 1px solid #27272a; }
        .header span { font-weight: bold; color: #3b82f6; font-size: 14px; }
        
        .main-content { flex: 1; display: flex; overflow: hidden; background: #000; }
        
        .video-wrapper { flex: 3; display: flex; flex-direction: column; background: #000; position: relative; }
        .video-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        #waiting-text { position: absolute; color: #9ca3af; font-size: 16px; font-weight: bold; text-align: center; }
        
        #unmute-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; cursor: pointer; }
        #unmute-overlay button { background: #3b82f6; color: white; padding: 15px 30px; border-radius: 50px; font-size: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #host-controls { display: none; background: #18181b; padding: 12px; justify-content: center; gap: 10px; border-top: 1px solid #27272a; }

        #reaction-bar { display: flex; justify-content: center; gap: 15px; padding: 8px; background: #111; border-top: 1px solid #27272a; z-index: 50; }
        .reaction-btn { font-size: 22px; cursor: pointer; background: transparent; border: none; transition: transform 0.2s; }
        .reaction-btn:hover { transform: scale(1.3); }
        
        .floating-emoji { position: absolute; bottom: 0; font-size: 40px; animation: floatUp 3s ease-out forwards; z-index: 200; pointer-events: none; }
        @keyframes floatUp {
            0% { bottom: 0; opacity: 1; transform: scale(1) translateX(0); }
            50% { opacity: 1; transform: scale(1.5) translateX(20px); }
            100% { bottom: 100%; opacity: 0; transform: scale(1) translateX(-20px); }
        }

        .chat-panel { flex: 1; background: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; min-width: 280px; max-width: 350px; height: 100%; }
        .chat-header { padding: 12px 15px; font-weight: bold; border-bottom: 1px solid #27272a; color: #3b82f6; font-size: 14px; background: #09090b; display: flex; justify-content: space-between; align-items: center; }
        #online-users { font-size: 11px; color: #a1a1aa; font-weight: normal; }
        
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { font-size: 13px; line-height: 1.4; word-break: break-word; background: #27272a; padding: 8px 12px; border-radius: 8px; border-bottom-right-radius: 2px; width: fit-content; max-width: 90%; color: #e4e4e7; }
        .msg .name { color: #60a5fa; font-weight: bold; display: block; margin-bottom: 2px; font-size: 11px; }
        
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #27272a; gap: 8px; background: #09090b; }
        .chat-input-area input { margin: 0; flex: 1; padding: 10px; font-size: 14px; border-radius: 8px; }
        .chat-input-area button { padding: 10px 15px; border-radius: 8px; white-space: nowrap; font-size: 14px; }
        #btn-emoji { background: #27272a; color: white; font-size: 18px; padding: 10px; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; height: calc(100dvh - 50px); }
            .video-wrapper { flex: 1; min-height: 35vh; }
            .chat-panel { flex: 1; max-width: 100%; border-right: none; border-top: 1px solid #27272a; height: 100%; }
            #host-controls { padding: 8px; flex-wrap: wrap; }
            .chat-input-area { position: sticky; bottom: 0; z-index: 10; padding-bottom: env(safe-area-inset-bottom, 10px); }
        }
    </style>
</head>
<body>
    <div id="login-view" class="view active">
        <div class="card">
            <h1>🍿 PCB Cinema</h1>
            <p>تماشای اختصاصی و چت با دوستان</p>
            <input type="text" id="username" placeholder="نام شما..." required autocomplete="off">
            <input type="text" id="room-id" placeholder="کد اتاق (مثلاً: 1234)" required autocomplete="off">
            <div class="btn-group">
                <button id="btn-host" class="primary">📡 ساخت اتاق (میزبان)</button>
                <button id="btn-join" class="secondary">📺 ورود به اتاق (تماشاگر)</button>
            </div>
        </div>
    </div>

    <div id="room-view" class="view">
        <div class="header">
            <span id="room-name">اتاق: ---</span>
            <span id="connection-status" style="font-size: 11px; color: #f59e0b;">● در حال اتصال</span>
            <button id="btn-leave" class="danger">خروج</button>
        </div>
        <div class="main-content">
            <div class="video-wrapper">
                <div class="video-container" id="video-container">
                    <video id="local-video" autoplay playsinline controls></video>
                    <video id="remote-video" autoplay playsinline controls muted></video>
                    
                    <div id="waiting-text">در انتظار اتصال...</div>
                    <div id="unmute-overlay">
                        <button id="btn-unmute">🔊 برای شنیدن صدا کلیک کنید</button>
                    </div>
                </div>
                
                <div id="reaction-bar" style="display: none;">
                    <button class="reaction-btn" onclick="sendReaction('❤️')">❤️</button>
                    <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
                    <button class="reaction-btn" onclick="sendReaction('😮')">😮</button>
                    <button class="reaction-btn" onclick="sendReaction('👍')">👍</button>
                    <button class="reaction-btn" onclick="sendReaction('🔥')">🔥</button>
                    <button class="reaction-btn" id="btn-fullscreen">⛶</button>
                </div>

                <div id="host-controls">
                    <input type="file" id="video-file" accept="video/*" style="display:none;">
                    <button id="btn-select-video" class="primary">📂 انتخاب فیلم</button>
                    <button id="btn-start-stream" class="primary" disabled>🚀 شروع سینما</button>
                </div>
            </div>
            
            <div class="chat-panel">
                <div class="chat-header">
                    <span>💬 چت زنده</span>
                    <span id="online-users">در حال بارگذاری...</span>
                </div>
                <div id="chat-messages"></div>
                <div class="chat-input-area">
                    <button id="btn-emoji">😀</button>
                    <input type="text" id="chat-input" placeholder="پیام..." autocomplete="off">
                    <button id="btn-send" class="primary">ارسال</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- قفل کردن نسخه کتابخانه برای جلوگیری از خطای CSP -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <script src="app.js?v=99"></script>
</body>
</html>
